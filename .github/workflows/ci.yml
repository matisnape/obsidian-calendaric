name: CI

# Pull requests only. This account has a limited Actions run-minute budget, so a
# push to a branch with no open pull request must not start a run. See US-ARCH-09.
on:
  pull_request:
    branches: [master]

# The job only needs to read the code. Without this, a pull request from a branch
# in this repository runs npm scripts with a writable token.
permissions:
  contents: read

jobs:
  # One job, so the pull request gets exactly one status check. The steps run in
  # order and the job stops at the first non-zero exit, which names the failed
  # step in the log.
  gates:
    name: install, test, build
    runs-on: ubuntu-latest

    # Install, test and build take about 11 seconds locally from an empty
    # node_modules, so a minute or two on a runner. Ten minutes is generous
    # headroom for a slow registry and still caps a hung job: the default is six
    # hours, and this account's run-minutes are limited.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Keep this version equal to the node pin in mise.toml. setup-node cannot
      # read mise.toml on any released version, so the number is repeated here
      # rather than derived. node-version-file is the better answer once a release
      # supports mise.toml: actions/setup-node#1421.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm

      # --ignore-scripts because package.json's prepare hook builds. Without it a
      # type error fails this step and the test step never runs, so the pull request
      # would report an install failure for what is really a build failure, with the
      # test gate silently skipped. The build step below runs the same build anyway.
      - name: install
        run: npm ci --ignore-scripts

      - name: test
        run: npm test

      - name: build
        run: npm run build

      # NOT ENFORCED YET, ON PURPOSE. The checker runs in its normal blocking
      # mode and really does exit non-zero; `continue-on-error` is what keeps
      # that off the pull request status today. Five already-merged stories
      # (US-ARCH-03, US-ARCH-09, US-FMT-06, US-MIG-01, US-TPL-02) carry 17
      # `pass` verdicts with no test title naming their criterion id, so
      # enforcing now would make master red the moment this merged.
      #
      # Fifteen of those are a tagging job: a real vitest test settles each one
      # and only the id is missing from its title. The other two,
      # AC-ARCH-09.1 and AC-ARCH-09.4, rest on an observed check run and on a
      # script re-run. Nothing can be tagged for those, so they are settled by
      # adding them to NO_REGRESSION_IDS in check_ac_coverage.py or by
      # accepting them as blocking — a decision, not a tagging job.
      #
      # To enforce: settle those 17, then delete the
      # `continue-on-error` line below. Nothing else changes — the command is
      # already the one that will run for real, so the log here shows exactly
      # what a red build will show. This state is temporary, not the intended
      # one, and the step is named so the log says so too.
      #
      # `npm run check:ac` rather than the script directly, because that script
      # runs its own --self-check first. The checker's regression cases are
      # then part of what CI executes instead of something only a human
      # remembers to run.
      #
      # `continue-on-error` rather than the script's own `--report-only`
      # because --report-only suppresses classified findings only: a vitest
      # crash, a malformed report or a temp-file failure would still exit
      # non-zero and redden the pull request, which is the opposite of a soft
      # rollout.
      #
      # The four `pass` verdicts the step lists under "passing with no
      # regression behind them" (AC-ARCH-09.2, AC-ARCH-09.5, AC-MIG-01.1,
      # AC-MIG-01.5) do not block the flip. They rest on code review, so there
      # is nothing to tag; they are listed to stay countable.
      - name: ac coverage (not enforced yet)
        continue-on-error: true
        run: npm run check:ac

      # No lint step. eslint fails on master with pre-existing errors, so a lint
      # gate would make every pull request red regardless of its content. DEC-26
      # records the reason and the exit condition: lint joins this workflow once a
      # separate cleanup story pays the debt down. Until then every agent runs
      # lint locally and confirms its own diff adds no new errors.
