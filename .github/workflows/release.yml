name: Release

# A pushed tag is the only event that publishes, and tags are rare, so this costs
# almost nothing against this account's limited Actions run-minutes. ci.yml is the
# pull-request gate; this is the release gate, and the two are deliberately
# different: a release additionally runs lint and the manifest checks, and it is
# allowed to fail in ways a pull request is not. See US-ARCH-06 and DEC-26.
#
# The pattern stays '*' rather than a semver glob on purpose. A tag named "v0.1.0"
# must reach the tag check and be rejected by name (AC-ARCH-06.3), not be silently
# ignored by the trigger — a release that never starts looks the same as a release
# nobody asked for.
on:
  push:
    tags:
      - '*'

permissions:
  contents: write # gh release create
  id-token: write # actions/attest signs with a short-lived OIDC token
  attestations: write

jobs:
  release:
    name: verify, build, draft release
    runs-on: ubuntu-latest

    # Same reasoning as ci.yml: the work takes a couple of minutes, and the default
    # of six hours would burn the run-minute budget on one hung job. A release runs
    # lint and the full test suite on top of what ci.yml does, hence 15 not 10.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # The manifest id stability check reads manifest.json out of the previous
          # release's tag, which a depth-1 checkout does not have. release-check.mjs
          # fails rather than skipping the check when the history is missing.
          fetch-depth: 0

      # Keep this version equal to the node pin in mise.toml and to ci.yml. The
      # upstream template said "24", which drifts to whatever 24.x the runner ships
      # and defeats the point of pinning at all.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm

      # First, before anything expensive. A tag that disagrees with manifest.json
      # can never produce a valid release, so there is no reason to install and
      # build before finding out. Uses only Node's standard library and git.
      - name: release checks
        run: npm run release-check --silent

      # --ignore-scripts because package.json's prepare hook builds, and a build runs
      # tsc. Without the flag a type error fails the install step, the job stops, and
      # lint and test never run at all — a green-looking pipeline with two gates
      # silently skipped, which is the exact failure AC-ARCH-06.5 and AC-ARCH-06.6
      # exist to prevent. The prepare path is checked below instead, after the gates.
      - name: install
        run: npm ci --ignore-scripts

      # type-check, lint and test. Any one failing fails this step, and the step
      # names which gate it was. Nothing downstream runs, so a failing gate cannot
      # publish a release.
      - name: verify
        run: npm run verify

      # Builds, and proves the prepare hook is what produces main.js: AC-ARCH-06.7
      # requires that installing from source needs no second command. The install
      # step skipped scripts, so this is the only place prepare runs, and main.js is
      # absent until it does. Running it after the gates means a failure here can
      # never be mistaken for, or hide, a gate that did not run.
      - name: build via the prepare hook
        run: |
          npm run prepare
          test -f main.js

      - name: check for optional styles
        id: styles
        run: |
          [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

      # Draft, not published. Publishing is the one step a human should take: it is
      # what makes the release visible to Obsidian's community catalogue, and it is
      # not undoable from a workflow's point of view.
      - name: create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
