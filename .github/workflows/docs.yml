name: Site

# Builds the site and publishes it to GitHub Pages (https://anks.pl/obsidian-calendaric/):
#   /        landing page         (site/index.md, Jekyll)
#   /guides/ the Markdown guides  (docs/*.md copied by site/assemble.sh, Jekyll)
#   /docs/   TypeDoc API reference
# Pages is set to "GitHub Actions" as its source in the repository settings.
# The build runs on pull requests too, so a change can be checked before merge;
# only master deploys. The paths filter skips changes that cannot alter the site.
on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "site/**"
      - "typedoc.json"
      - "docs/user-manual.md"
      - "docs/guide.md"
      - "docs/code-map.md"
      - "docs/qa/testing-guide.md"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "src/**"
      - "site/**"
      - "typedoc.json"
      - "docs/user-manual.md"
      - "docs/guide.md"
      - "docs/code-map.md"
      - "docs/qa/testing-guide.md"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. A newer push waits for the running deploy
# instead of cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Keep this version equal to the node pin in mise.toml, as in ci.yml.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm

      # --ignore-scripts because package.json's prepare hook builds main.js,
      # which the docs do not need.
      - name: install
        run: npm ci --ignore-scripts

      - name: assemble guides
        run: site/assemble.sh

      - name: build pages (Jekyll)
        uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site

      # The Primer theme adds an "Improve this page" link built from the page path
      # (guides/x.md), which does not exist in the repo. Drop it.
      - name: remove broken edit link
        run: sudo find _site -name '*.html' -exec sed -i 's#This site is open source\. <a href="[^"]*">Improve this page</a>\.##' {} +

      - name: API docs (TypeDoc)
        run: |
          npm run docs
          sudo cp -R dist/docs _site/docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # A Pages deployment is keyed by the commit sha. Once one is cancelled (the
  # 10-minute timeout below, or a stall on GitHub's side), every rerun for that
  # same commit fails within seconds with "Deployment cancelled." Rerunning does
  # not help: land a new commit on master instead.
  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
